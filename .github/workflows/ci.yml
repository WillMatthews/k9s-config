name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck k9s_configure.sh tests/run.sh tests/bin/*

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          # macOS runs the script with the bash 3.2 it ships, plus BSD sed and sort.
          - os: macos-latest
            bash: /bin/bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        if: runner.os == 'macOS'
        run: brew install yq
      - run: yq --version && ${{ matrix.bash }} --version
      - name: Run tests
        run: tests/run.sh
        env:
          TEST_BASH: ${{ matrix.bash }}
