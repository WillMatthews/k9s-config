# Configuration for k9s_configure.sh.

# Base skin, from https://github.com/derailed/k9s/tree/master/skins.
# It must set its background through a `background: &background` anchor, which
# the script checks for. Dark skins work best with the tints below.
theme: one-dark

# Background colour for each variant. The script makes one copy of the theme per
# entry, e.g. one-dark-red.yaml.
colours:
  red: "#3f1f28"
  orange: "#3f2f1f"
  green: "#1f2f28"
  blue: "#1f283f"
  purple: "#2f1f3f"
  grey: "#2f2f2f"

# Rules for the colour each kube context gets, checked against every context in
# your kubeconfig. The first rule that matches a context wins.
#   name:  matches one context exactly
#   match: a shell glob pattern, e.g. "*prod*"
contexts:
  - name: minikube
    colour: green
  - match: "*prod*"
    colour: red
  - match: "*test*"
    colour: purple
  - match: "*dev*"
    colour: blue
  # The cluster is looked up in your kubeconfig. For a `name` rule you can set
  # it yourself, so the skin is ready before the context is added:
  # - name: aks-staging
  #   cluster: aks-staging-cluster
  #   colour: orange

# Colour for contexts that no rule matches. Leave it out to leave those
# contexts alone.
default: grey
